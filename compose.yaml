services:
  adapter:
    build: .
    restart: unless-stopped
    init: true
    networks:
      tunnel:
        aliases:
          - timeedit-adapter
    environment:
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-600}
      STALE_TTL_SECONDS: ${STALE_TTL_SECONDS:-86400}
    volumes:
      - type: bind
        source: ./transforms.py
        target: /app/transforms.py
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).read()"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

networks:
  tunnel:
    external: true
    name: ${TUNNEL_NETWORK:-cloudflared}
